[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, default
upload_speed = 921600
build_flags = 
    -DCORE_DEBUG_LEVEL=3
    -Wall
    -Wextra
    -O2
lib_deps = 
    bblanchon/ArduinoJson @ ^7.0.4
    knolleary/PubSubClient @ ^2.8
    Wire
