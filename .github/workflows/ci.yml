name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          cd core
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint with ruff
        run: |
          cd core
          ruff check .
      - name: Run tests with mock HAL
        env:
          DROID_HAL: mock
          SECRET_KEY: ci-test-secret-key-for-jwt-signing-test
        run: |
          cd core
          pytest -v
